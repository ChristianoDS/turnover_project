[project]
name = "projeto-turnover"
version = "0.1.0"
description = "Modelo de classificação de turnover (attrition) com app Streamlit para score de rotatividade."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.6",
    "scikit-learn>=1.5",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "ruff==0.6.9",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "commitizen>=3.29",
    "nbstripout>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turnover"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
